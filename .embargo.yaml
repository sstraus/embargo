# embargo policy for this repo. Minimal on purpose: it pins the age gate and
# lets everything else fall back to the built-in defaults (all ecosystems
# enforced, direct+transitive on, fail-closed). This is what `embargo init`
# scaffolds.
#
# See .embargo.example.yaml for a fully commented reference of every field
# (allow/block lists, remote shared lists, per-package exceptions, policy).

# A version must be at least this old before it may be installed/used.
# Accepts Go-style durations ("72h", "30m") or a bare number of seconds.
minimumReleaseAge: 72h
